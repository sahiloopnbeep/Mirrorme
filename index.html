<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Me – Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    background: #F5F8FA;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
    color: #243447;
}

}
    
.dashboard {
    display: flex;
    gap: 24px;
    max-width: 1100px;
    width: 100%;
    background: #FFFFFF;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid #E1E8ED;
    box-shadow: 0 4px 20px rgba(35, 52, 71, 0.05);
}

.left-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 260px;
}

.refresh-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}

.refresh-row .last-updated {
    font-size: 0.65rem;
    color: #82919C;
}
.refresh-btn {
    background: #FFFFFF;
    border: 1px solid #DCE5EA;
    color: #526775;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.7rem;
    cursor: pointer;
    transition: 0.2s;
}

.refresh-btn:hover {
    background: #F0F5F7;
    color: #243447;
}
.data-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 10px;
    background: #FFFFFF;
    border: 1px solid #E1E8ED;
    box-shadow: 0 2px 6px rgba(35, 52, 71, 0.04);
    color: #243447;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    width: 100%;
}

.data-btn:hover {
    transform: translateY(-2px);
    border-color: #B8CBD4;
    background: #FAFCFD;
}

.data-btn .btn-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.data-btn .btn-icon svg {
    width: 100%;
    height: 100%;
}

.data-btn .btn-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #526775;
    flex: 1;
    text-align: left;
}

.data-btn .btn-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1.1rem;
}

.data-btn .btn-unit {
    font-size: 0.6rem;
    color: #82919C;
    margin-left: 2px;
}

.btn-gut {
    border-left: 4px solid #00E5FF;
}

.btn-gut .btn-value {
    color: #00E5FF;
}

.btn-metabolism {
    border-left: 4px solid #00FF87;
}

.btn-metabolism .btn-value {
    color: #00FF87;
}

.btn-muscular {
    border-left: 4px solid #FFD000;
}

.btn-muscular .btn-value {
    color: #FFD000;
}

.btn-stress {
    border-left: 4px solid #FF1744;
}

.btn-stress .btn-value {
    color: #FF1744;
}

.data-btn.active {
    border-color: #91B8C2;
    box-shadow: 0 3px 12px rgba(35, 52, 71, 0.08);
    background: #F5FAFB;
}

.right-panel {
    flex: 1;
    min-width: 0;
    min-height: 400px;
    background: #F9FBFC;
    border-radius: 12px;
    border: 1px solid #E1E8ED;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.right-panel .placeholder {
    color: #82919C;
    font-size: 0.95rem;
    text-align: center;
    line-height: 1.6;
}

.right-panel .placeholder .icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 12px;
}

.treemap {
    display: none;
    width: 100%;
}

.treemap.show {
    display: block;
}

.treemap h3 {
    color: #243447;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 16px;
    border-bottom: 1px solid #E5EBEF;
    padding-bottom: 12px;
}

.treemap-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.treemap-item {
    background: #FFFFFF;
    border-radius: 10px;
    padding: 18px 16px;
    border: 1px solid #E1E8ED;
    transition: 0.2s;
}

.treemap-item:hover {
    background: #F5F9FB;
}

.treemap-item .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #718391;
    font-weight: 600;
}

.treemap-item .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    margin-top: 4px;
    word-break: break-word;
}

.treemap-item .detail {
    font-size: 0.7rem;
    color: #82919C;
    margin-top: 6px;
}

.treemap-close {
    margin-top: 20px;
    padding: 10px 24px;
    background: #FFFFFF;
    border: 1px solid #DCE5EA;
    border-radius: 8px;
    color: #526775;
    cursor: pointer;
    font-size: 0.8rem;
    transition: 0.2s;
    align-self: center;
}

.treemap-close:hover {
    background: #F0F5F7;
    color: #243447;
}
@media (max-width: 760px) {
    .dashboard {
        flex-direction: column;
    }

    .left-panel {
        min-width: 0;
    }

    .right-panel {
        min-height: 350px;
    }
}
</style>
</head>

<body>

<div class="dashboard">

    <div class="left-panel">

       <button
    class="refresh-btn"
    onclick="window.location.href='/profile.html'"
>
    ↑ View My Profile
</button>
        
        <div class="refresh-row">

            <button
                class="refresh-btn"
                onclick="fetchDashboardData()"
            >
                ↻ Refresh
            </button>

            <span
                class="last-updated"
                id="lastUpdated"
            >
                Last updated: —
            </span>

        </div>

        
<button class="data-btn" id="profileBtn" type="button" onclick="showProfile()">
    <span class="btn-label">View Profile</span>
    <span class="btn-value">→</span>
</button>

document.getElementById('allergySeverity').textContent =
    data.allergy_severity ?? '—';


        <button
            class="data-btn btn-gut"
            data-metric="gut"
        >

            <span class="btn-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 2v2"/>
                    <path d="M12 4c-3.5 0-5 1.5-5 3.5S8.5 11 12 11s5 1.5 5 3.5S15.5 18 12 18"/>
                    <path d="M8 7.5c-2.5 0-4 1.2-4 3s1.5 3 4 3 4 1.2 4 3-1.5 3-4 3"/>
                    <path d="M16 10.5c2.5 0 4 1.2 4 3-1.5 3-4 3"/>
                    <path d="M12 18v4"/>
                </svg>
            </span>

            <span class="btn-label">
                Gut Health
            </span>

            <span class="btn-value">
                <span id="gutScore">—</span>
                <span class="btn-unit">%</span>
            </span>

        </button>

        <button
            class="data-btn btn-metabolism"
            data-metric="metabolism"
        >

            <span class="btn-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </span>

            <span class="btn-label">
                Metabolism
            </span>

            <span class="btn-value">
                <span id="metabolismScore">—</span>
                <span class="btn-unit">%</span>
            </span>

        </button>

        <button
            class="data-btn btn-muscular"
            data-metric="muscular"
        >

            <span class="btn-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M20.5 5c-.83 0-1.5.67-1.5 1.5V9h-1c-1.1 0-2 .9-2 2v.5c-1.18-.76-2.61-1.12-4.11-.86-2.07.36-3.77 1.95-4.23 4C7.23 16.5 8.5 18 10.5 18h8c1.38 0 2.5-1.12 2.5-2.5V6.5c0-.83-.67-1.5-1.5-1.5zM7.5 13.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5S6 15.83 6 15s.67-1.5 1.5-1.5z"/>
                    <path d="M3 19c2-3 4.5-4 7.5-4"/>
                </svg>
            </span>

            <span class="btn-label">
                Muscular
            </span>

            <span class="btn-value">
                <span id="muscularScore">—</span>
                <span class="btn-unit">%</span>
            </span>

        </button>

        <button
            class="data-btn btn-stress"
            data-metric="stress"
        >

            <span class="btn-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 2v3m0 14v3"/>
                    <path d="M8 6h8l-7 4 7 4-7 4h8"/>
                </svg>
            </span>

            <span class="btn-label">
                Stress Resilience
            </span>

            <span class="btn-value">
                <span id="stressScore">—</span>
                <span class="btn-unit">%</span>
            </span>

        </button>

    </div>

    <div
        class="right-panel"
        id="rightPanel"
    >

        <div
            class="placeholder"
            id="placeholder"
        >
            <span class="icon">🧘</span>
            Select a metric to view your detailed health treemap.
        </div>

        <div
            class="treemap"
            id="treemap"
        >

            <h3 id="treemapTitle">
                Gut Health — Breakdown
            </h3>

            <div
                class="treemap-grid"
                id="treemapGrid"
            ></div>

            <button
                class="treemap-close"
                onclick="closeTreemap()"
            >
                ← Close Treemap
            </button>

        </div>
        
<div class="treemap" id="profileView">
    <h3>My Profile</h3>

    <div class="treemap-grid">
        <div class="treemap-item">
            <div class="label">Full Name</div>
            <div class="value" id="profileName">—</div>
        </div>

        <div class="treemap-item">
            <div class="label">Date of Birth</div>
            <div class="value" id="profileDob">—</div>
        </div>

        <div class="treemap-item">
            <div class="label">Sex</div>
            <div class="value" id="profileSex">—</div>
        </div>

        <div class="treemap-item">
            <div class="label">Age</div>
            <div class="value" id="profileAge">—</div>
        </div>

        <div class="treemap-item">
            <div class="label">BMI</div>
            <div class="value" id="profileBmi">—</div>
        </div>

        <div class="treemap-item">
            <div class="label">Waist-to-Hip Ratio</div>
            <div class="value" id="profileWhr">—</div>
        </div>
    </div>
    
<h3 style="margin-top: 28px;">Allergy Details</h3>

<div class="treemap-grid">
    <div class="treemap-item">
        <div class="label">Allergy Severity</div>
        <div class="value" id="allergySeverity">—</div>
    </div>
</div>

    <button class="treemap-close" type="button" onclick="closeProfile()">
        ← Back to Dashboard
    </button>

</div>


    </div>

</div>

<script>

const SUPABASE_URL =
   'https://iizpxuvojsfuulljmhkl.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_G9Athn6C6Pjmdj3P5tGPaw_CmUuxs54';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );

const metricConfig = {

    gut: {
        label: 'Gut Health',
        color: '#00E5FF',
        scoreCol: 'gut_health_score',
        treemap: [
            {
                label: 'Insights',
                col: 'gut_health_insights'
            },
            {
                label: 'Clinical Insights',
                col: 'gut_clinical_insights'
            },
            {
                label: 'Recommended Action',
                col: 'gut_action'
            }
        ]
    },

    metabolism: {
        label: 'Metabolism',
        color: '#00FF87',
        scoreCol: 'metabolic_score',
        treemap: [
            {
                label: 'Interpretation',
                col: 'metabolic_interpretation'
            },
            {
                label: 'Clinical Insights',
                col: 'metabolic_clinical'
            },
            {
                label: 'Recommended Action',
                col: 'metabolic_action'
            }
        ]
    },

    muscular: {
        label: 'Muscular',
        color: '#FFD000',
        scoreCol: 'musculoskeletal_score',
        treemap: [
            {
                label: 'Interpretation',
                col: 'musculoskeletal_interpretation'
            },
            {
                label: 'Clinical Insights',
                col: 'muscle_clinical'
            },
            {
                label: 'Recommended Action',
                col: 'muscle_action'
            }
        ]
    },

    stress: {
        label: 'Stress Resilience',
        color: '#FF1744',
        scoreCol: 'stress_score',
        treemap: [
            {
                label: 'Interpretation',
                col: 'stress_interpretation'
            },
            {
                label: 'Clinical Insights',
                col: 'stress_clinical'
            },
            {
                label: 'Recommended Action',
                col: 'stress_action'
            }
        ]
    }

};

let currentMemberData = null;
let activeMetric = null;

const gutScoreEl =
    document.getElementById('gutScore');

const metabolismScoreEl =
    document.getElementById('metabolismScore');

const muscularScoreEl =
    document.getElementById('muscularScore');

const stressScoreEl =
    document.getElementById('stressScore');

const lastUpdatedEl =
    document.getElementById('lastUpdated');

const placeholder =
    document.getElementById('placeholder');

const treemap =
    document.getElementById('treemap');

const treemapTitle =
    document.getElementById('treemapTitle');

const treemapGrid =
    document.getElementById('treemapGrid');

async function getCurrentSession() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error) {
        console.error(
            'Session error:',
            error
        );
        return null;
    }

    return data.session;
}

async function fetchDashboardData() {

    try {

        const response =
            await fetch(
                '/api/member-data',
                {
                    method: 'GET',
                    credentials: 'include'
                }
            );

        if (response.status === 401) {

            window.location.replace(
                '/login.html'
            );

            return;
        }

        const result =
            await response.json();

        if (!response.ok) {

            console.error(
                'Member data error:',
                result.error
            );

            clearUI();

            lastUpdatedEl.textContent =
                'Unable to load data';

            return;
        }

        if (result) {

            currentMemberData =
                result;

            updateUI(
                currentMemberData
            );

            lastUpdatedEl.textContent =
                'Last updated: ' +
                new Date().toLocaleTimeString();

        } else {

            clearUI();

            lastUpdatedEl.textContent =
                'No report available';

        }

    } catch (error) {

        console.error(
            'Dashboard error:',
            error
        );

        clearUI();

        lastUpdatedEl.textContent =
            'Unable to load data';

    }

}

function updateUI(data) {

    gutScoreEl.textContent =
        data.gut_health_score ??
        '-';

    metabolismScoreEl.textContent =
        data.metabolic_score ??
        '-';

    muscularScoreEl.textContent =
        data.musculoskeletal_score ??
        '-';

    stressScoreEl.textContent =
        data.stress_score ??
        '-';

    if (activeMetric) {

        showTreemap(
            activeMetric,
            data
        );

    }

}

function clearUI() {

    gutScoreEl.textContent = '-';

    metabolismScoreEl.textContent = '-';

    muscularScoreEl.textContent = '-';

    stressScoreEl.textContent = '-';

}

function showTreemap(
    metricKey,
    data
) {

    const config =
        metricConfig[metricKey];

    if (!config) {
        return;
    }

    activeMetric =
        metricKey;

    let itemsHtml = '';

    const scoreValue =
        data[config.scoreCol];

    const scoreDisplay =
        scoreValue !== null &&
        scoreValue !== undefined
            ? scoreValue + '%'
            : '-';

    itemsHtml +=
        '<div class="treemap-item">' +
        '<div class="label">Score</div>' +
        '<div class="value" style="color:' +
        config.color +
        ';">' +
        scoreDisplay +
        '</div>' +
        '<div class="detail">Current value</div>' +
        '</div>';

    config.treemap.forEach(
        function(field) {

            const value =
                data[field.col];

            const displayValue =
                value !== null &&
                value !== undefined &&
                value !== ''
                    ? value
                    : '-';

            itemsHtml +=
                '<div class="treemap-item">' +
                '<div class="label">' +
                field.label +
                '</div>' +
                '<div class="value" style="color:' +
                config.color +
                '; font-size:1rem;">' +
                displayValue +
                '</div>' +
                '<div class="detail">—</div>' +
                '</div>';

        }
    );

    treemapGrid.innerHTML =
        itemsHtml;

    treemapTitle.textContent =
        config.label +
        ' — Breakdown';

    placeholder.style.display =
        'none';

    treemap.classList.add(
        'show'
    );

}
    
function showProfile() {
    if (!currentMemberData) {
        fetchDashboardData();
        return;
    }

    const data = currentMemberData.member ||
                 currentMemberData.data ||
                 currentMemberData;

    document.getElementById('profileName').textContent =
        data.name ?? '—';

    document.getElementById('profileDob').textContent =
        data.dob ?? '—';

    document.getElementById('profileSex').textContent =
        data.sex ?? '—';

    document.getElementById('profileAge').textContent =
        data.age ?? '—';

    document.getElementById('profileBmi').textContent =
        data.bmi ?? '—';

    document.getElementById('profileWhr').textContent =
        data.whr ?? '—';

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('treemap').classList.remove('show');
    document.getElementById('profileView').classList.add('show');

    document.querySelectorAll('.data-btn').forEach(button => {
        button.classList.remove('active');
    });

    activeMetric = null;
}

function closeProfile() {
    document.getElementById('profileView').classList.remove('show');
    document.getElementById('placeholder').style.display = 'block';
}


function closeTreemap() {

    treemap.classList.remove(
        'show'
    );

    placeholder.style.display =
        'block';

    activeMetric = null;

    document
        .querySelectorAll('.data-btn')
        .forEach(
            function(button) {

                button.classList.remove(
                    'active'
                );

            }
        );

}

document
    .querySelectorAll('.data-btn')
    .forEach(
        function(button) {

            button.addEventListener(
                'click',
                function() {

                    const metric =
                        this.getAttribute(
                            'data-metric'
                        );

                    if (!currentMemberData) {
                        return;
                    }

                    document
                        .querySelectorAll('.data-btn')
                        .forEach(
                            function(button) {

                                button.classList.remove(
                                    'active'
                                );

                            }
                        );

                    this.classList.add(
                        'active'
                    );

                    showTreemap(
                        metric,
                        currentMemberData
                    );

                }
            );

        }
    );



window.fetchDashboardData =
    fetchDashboardData;

window.closeTreemap =
    closeTreemap;

window.addEventListener(
    'DOMContentLoaded',
    function() {

        fetchDashboardData();

    }
);

</script>

</body>
</html>
