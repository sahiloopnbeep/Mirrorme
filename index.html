<script>

    /*
     * =========================================================
     * MIRROR ME — AUTHENTICATION + DASHBOARD
     * =========================================================
     */

    const SUPABASE_URL =
        'https://iizpxuvojsfuulljmhkl.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
        'sb_publishable_G9Athn6C6Pjmdj3P5tGPaw_CmUuxs54';


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );


    /*
     * Dashboard configuration
     */

    var metricConfig = {

        gut: {

            label: 'Gut Health',

            color: '#00E5FF',

            scoreCol: 'gut_health_score',

            treemap: [

                {
                    label: 'Insights',
                    col: 'gut_health_insights'
                },

                {
                    label: 'Clinical Insights',
                    col: 'gut_clinical_insights'
                },

                {
                    label: 'Recommended Action',
                    col: 'gut_action'
                }

            ]

        },


        metabolism: {

            label: 'Metabolism',

            color: '#00FF87',

            scoreCol: 'metabolic_score',

            treemap: [

                {
                    label: 'Interpretation',
                    col: 'metabolic_interpretation'
                },

                {
                    label: 'Clinical Insights',
                    col: 'metabolic_clinical'
                },

                {
                    label: 'Recommended Action',
                    col: 'metabolic_action'
                }

            ]

        },


        muscular: {

            label: 'Muscular',

            color: '#FFD000',

            scoreCol: 'musculoskeletal_score',

            treemap: [

                {
                    label: 'Interpretation',
                    col: 'musculoskeletal_interpretation'
                },

                {
                    label: 'Clinical Insights',
                    col: 'muscle_clinical'
                },

                {
                    label: 'Recommended Action',
                    col: 'muscle_action'
                }

            ]

        },


        stress: {

            label: 'Stress Resilience',

            color: '#FF1744',

            scoreCol: 'stress_resilience_score',

            treemap: [

                {
                    label: 'Interpretation',
                    col: 'stress_interpretation'
                },

                {
                    label: 'Clinical Insights',
                    col: 'stress_clinical'
                },

                {
                    label: 'Recommended Action',
                    col: 'stress_action'
                }

            ]

        }

    };


    var currentMemberData = null;

    var activeMetric = null;


    var gutScoreEl =
        document.getElementById('gutScore');

    var metabolismScoreEl =
        document.getElementById('metabolismScore');

    var muscularScoreEl =
        document.getElementById('muscularScore');

    var stressScoreEl =
        document.getElementById('stressScore');

    var lastUpdatedEl =
        document.getElementById('lastUpdated');

    var placeholder =
        document.getElementById('placeholder');

    var treemap =
        document.getElementById('treemap');

    var treemapTitle =
        document.getElementById('treemapTitle');

    var treemapGrid =
        document.getElementById('treemapGrid');


    /*
     * =========================================================
     * GET CURRENT SUPABASE USER
     * =========================================================
     */

    async function getLoggedInUser() {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                'Unable to read Supabase session:',
                error
            );

            return null;
        }


        if (!data.session) {

            return null;
        }


        return data.session.user;
    }


    /*
     * =========================================================
     * LOAD DASHBOARD DATA
     * =========================================================
     */

    async function fetchDashboardData() {

        const user =
            await getLoggedInUser();


        /*
         * No valid session.
         * Send the user to login.
         */

        if (!user) {

            console.warn(
                'No active Mirror Me session.'
            );

            window.location.href =
                '/login.html';

            return;
        }


        const email =
            user.email;


        console.log(
            'Logged-in Mirror Me user:',
            email
        );


        /*
         * Query the member's data.
         */

        const url =
            SUPABASE_URL +
            '/rest/v1/member_calculations?email=eq.' +
            encodeURIComponent(email);


        try {

            const response =
                await fetch(
                    url,
                    {
                        method: 'GET',

                        headers: {

                            'apikey':
                                SUPABASE_PUBLISHABLE_KEY,

                            'Authorization':
                                'Bearer ' +
                                SUPABASE_PUBLISHABLE_KEY

                        }

                    }
                );


            if (!response.ok) {

                throw new Error(
                    'HTTP ' +
                    response.status
                );
            }


            const data =
                await response.json();


            if (
                data &&
                data.length > 0
            ) {

                currentMemberData =
                    data[0];


                updateUI(
                    currentMemberData
                );


                lastUpdatedEl.textContent =
                    'Last updated: ' +
                    new Date().toLocaleTimeString();

            } else {

                console.warn(
                    'No member data found for:',
                    email
                );

                clearUI();

            }

        } catch (error) {

            console.error(
                'Error fetching member data:',
                error
            );

            clearUI();

        }

    }


    /*
     * =========================================================
     * UPDATE SCORE UI
     * =========================================================
     */

    function updateUI(data) {

        gutScoreEl.textContent =
            data.gut_health_score !== null &&
            data.gut_health_score !== undefined
                ? data.gut_health_score
                : '-';


        metabolismScoreEl.textContent =
            data.metabolic_score !== null &&
            data.metabolic_score !== undefined
                ? data.metabolic_score
                : '-';


        muscularScoreEl.textContent =
            data.musculoskeletal_score !== null &&
            data.musculoskeletal_score !== undefined
                ? data.musculoskeletal_score
                : '-';


        stressScoreEl.textContent =
            data.stress_resilience_score !== null &&
            data.stress_resilience_score !== undefined
                ? data.stress_resilience_score
                : '-';


        if (activeMetric) {

            showTreemap(
                activeMetric,
                data
            );

        }

    }


    /*
     * =========================================================
     * CLEAR UI
     * =========================================================
     */

    function clearUI() {

        gutScoreEl.textContent = '-';

        metabolismScoreEl.textContent = '-';

        muscularScoreEl.textContent = '-';

        stressScoreEl.textContent = '-';

        lastUpdatedEl.textContent =
            'Last updated: —';

    }


    /*
     * =========================================================
     * TREEMAP
     * =========================================================
     */

    function showTreemap(
        metricKey,
        data
    ) {

        var config =
            metricConfig[metricKey];


        if (!config) {

            return;
        }


        activeMetric =
            metricKey;


        var itemsHtml = '';


        var treemapFields =
            config.treemap;


        var scoreValue =
            data[config.scoreCol];


        var scoreDisplay =
            scoreValue !== null &&
            scoreValue !== undefined
                ? scoreValue + '%'
                : '-';


        itemsHtml +=
            '<div class="treemap-item">' +

                '<div class="label">' +
                    'Score' +
                '</div>' +

                '<div class="value" style="color:' +
                    config.color +
                ';">' +
                    scoreDisplay +
                '</div>' +

                '<div class="detail">' +
                    'Current value' +
                '</div>' +

            '</div>';


        treemapFields.forEach(
            function(field) {

                var value =
                    data[field.col];


                var displayValue =
                    value !== null &&
                    value !== undefined &&
                    value !== ''
                        ? value
                        : '-';


                itemsHtml +=
                    '<div class="treemap-item">' +

                        '<div class="label">' +
                            field.label +
                        '</div>' +

                        '<div class="value" style="color:' +
                            config.color +
                            '; font-size:1rem;">' +
                            displayValue +
                        '</div>' +

                        '<div class="detail">' +
                            '—' +
                        '</div>' +

                    '</div>';

            }
        );


        treemapGrid.innerHTML =
            itemsHtml;


        treemapTitle.textContent =
            config.label +
            ' — Breakdown';


        placeholder.style.display =
            'none';


        treemap.classList.add(
            'show'
        );

    }


    /*
     * =========================================================
     * CLOSE TREEMAP
     * =========================================================
     */

    function closeTreemap() {

        treemap.classList.remove(
            'show'
        );


        placeholder.style.display =
            'block';


        activeMetric = null;


        document
            .querySelectorAll('.data-btn')
            .forEach(
                function(button) {

                    button.classList.remove(
                        'active'
                    );

                }
            );

    }


    /*
     * =========================================================
     * BUTTONS
     * =========================================================
     */

    document
        .querySelectorAll('.data-btn')
        .forEach(
            function(button) {

                button.addEventListener(
                    'click',
                    function() {

                        var metric =
                            this.getAttribute(
                                'data-metric'
                            );


                        if (!currentMemberData) {

                            fetchDashboardData();

                            return;
                        }


                        document
                            .querySelectorAll('.data-btn')
                            .forEach(
                                function(button) {

                                    button.classList.remove(
                                        'active'
                                    );

                                }
                            );


                        this.classList.add(
                            'active'
                        );


                        showTreemap(
                            metric,
                            currentMemberData
                        );

                    }
                );

            }
        );


    /*
     * =========================================================
     * INITIAL AUTHENTICATION CHECK
     * =========================================================
     */

    window.addEventListener(
        'DOMContentLoaded',
        async function() {

            console.log(
                'Mirror Me dashboard starting...'
            );


            const user =
                await getLoggedInUser();


            if (!user) {

                console.log(
                    'No session. Sending to login.'
                );


                window.location.href =
                    '/login.html';


                return;
            }


            console.log(
                'Authenticated as:',
                user.email
            );


            await fetchDashboardData();

        }
    );


    /*
     * =========================================================
     * AUTH STATE LISTENER
     * =========================================================
     */

    supabaseClient.auth.onAuthStateChange(
        function(event, session) {

            console.log(
                'Mirror Me auth event:',
                event
            );


            if (
                event === 'SIGNED_OUT'
            ) {

                window.location.href =
                    '/login.html';

            }

        }
    );


    /*
     * Make functions available
     * to the HTML buttons.
     */

    window.fetchDashboardData =
        fetchDashboardData;

    window.closeTreemap =
        closeTreemap;

</script>

</body>
