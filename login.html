```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Me — Member Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: #f4f7fc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 45px 40px;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 12px;
}

.logo span {
    font-weight: 400;
}

.subhead {
    text-align: center;
    color: #687386;
    font-size: 15px;
    margin-bottom: 32px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #303846;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #d8dee8;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    margin-bottom: 18px;
}

input:focus {
    border-color: #7b8798;
}

.btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #202936;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message-box {
    min-height: 22px;
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
}

.footer-note {
    text-align: center;
    margin-top: 25px;
    color: #8a94a4;
    font-size: 12px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        Mirror <span>Me</span>
    </div>

    <div class="subhead">
        Enter your email and Access PIN to sign in securely
    </div>

    <form id="loginForm">

        <label for="emailInput">
            Email address
        </label>

        <input
            type="email"
            id="emailInput"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

        <label for="pinInput">
            Access PIN
        </label>

        <input
            type="password"
            id="pinInput"
            placeholder="Enter your Access PIN"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="btn-primary"
            id="loginBtn"
        >
            Sign In
        </button>

    </form>

    <div
        id="messageBox"
        class="message-box"
    ></div>

    <div class="footer-note">
        Use the email address and private Access PIN provided to you.
    </div>

</div>

<script>
const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("emailInput");
const pinInput = document.getElementById("pinInput");
const loginBtn = document.getElementById("loginBtn");
const messageBox = document.getElementById("messageBox");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = emailInput.value.trim();
    const access_key = pinInput.value.trim();

    if (!email || !access_key) {
        messageBox.textContent = "Please enter your email and Access PIN.";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";
    messageBox.textContent = "";

    try {
        const response = await fetch("/api/member-login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                email: email,
                access_key: access_key
            })
        });

        const result = await response.json();

        if (!response.ok) {
            messageBox.textContent = result.error || "Unable to sign in.";
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In";
            return;
        }

        messageBox.textContent = "Sign in successful.";

        window.location.href = "/";

    } catch (error) {
        messageBox.textContent = "Unable to connect. Please try again.";
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
    }
});
</script>

</body>
</html>
```
