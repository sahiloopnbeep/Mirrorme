<body>

<div class="card">

    <div class="logo">
        Mirror <span>Me</span>
    </div>

    <div class="subhead">
        Enter your email to sign in securely
    </div>

    <form id="loginForm">

        <label for="emailInput">
            Email address
        </label>

        <input
            type="email"
            id="emailInput"
            placeholder="you@example.com"
            autocomplete="email"
            required
        />

        <button
            type="submit"
            class="btn-primary"
            id="sendBtn"
        >
            Sign in with Magic Link
        </button>

    </form>

    <div
        id="messageBox"
        class="message-box"
    ></div>

    <div class="footer-note">
        You'll receive a one-click sign-in link via email.
    </div>

</div>

<script>

    /*
     * =========================================================
     * MIRROR ME — SUPABASE AUTHENTICATION
     * =========================================================
     */

    const SUPABASE_URL =
        'https://iizpxuvojsfuulljmhkl.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
        'sb_publishable_G9Athn6C6Pjmdj3P5tGPaw_CmUuxs54';

    /*
     * IMPORTANT:
     * This is your production Vercel domain.
     */
    const REDIRECT_URL =
        'https://mirrorme-drab.vercel.app/';


    /*
     * Create the Supabase client.
     *
     * persistSession = true
     * means Supabase keeps the login session
     * in the browser.
     *
     * detectSessionInUrl = true
     * allows Supabase to process the
     * authentication information returned
     * by the Magic Link.
     */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );


    const loginForm =
        document.getElementById('loginForm');

    const emailInput =
        document.getElementById('emailInput');

    const sendBtn =
        document.getElementById('sendBtn');

    const messageBox =
        document.getElementById('messageBox');


    function showMessage(text, type) {

        messageBox.className =
            'message-box show ' + type;

        messageBox.textContent = text;
    }


    function setLoading(loading) {

        sendBtn.disabled = loading;

        if (loading) {

            sendBtn.innerHTML =
                '<span class="spinner"></span>Sending...';

        } else {

            sendBtn.textContent =
                'Sign in with Magic Link';
        }
    }


    /*
     * If the user is already logged in,
     * don't show the login page again.
     */

    async function checkExistingSession() {

        const { data, error } =
            await supabaseClient.auth.getSession();

        if (error) {

            console.error(
                'Session check error:',
                error
            );

            return;
        }

        if (data.session) {

            window.location.href =
                REDIRECT_URL;
        }
    }


    /*
     * Send Magic Link.
     */

    loginForm.addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            if (!email) {

                showMessage(
                    'Please enter your email address.',
                    'error'
                );

                return;
            }


            setLoading(true);


            const { error } =
                await supabaseClient.auth.signInWithOtp({

                    email: email,

                    options: {

                        emailRedirectTo:
                            REDIRECT_URL

                    }

                });


            setLoading(false);


            if (error) {

                console.error(
                    'Magic Link error:',
                    error
                );

                showMessage(
                    error.message,
                    'error'
                );

                return;
            }


            showMessage(
                'Magic Link sent! Check your email and click the link to continue.',
                'success'
            );

        }
    );


    /*
     * Listen for authentication changes.
     *
     * This is important when the Magic Link
     * returns to this website.
     */

    supabaseClient.auth.onAuthStateChange(
        function(event, session) {

            console.log(
                'Mirror Me Auth Event:',
                event
            );

            if (
                event === 'SIGNED_IN' &&
                session
            ) {

                window.location.href =
                    REDIRECT_URL;
            }

        }
    );


    /*
     * Check whether the user was already
     * logged in when this page opened.
     */

    checkExistingSession();

</script>

</body>
</html>
